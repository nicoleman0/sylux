[package]
name = "sylux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

[[bin]]
name = "sqlite-provenance"
path = "tools/sqlite-provenance.rs"

[[bin]]
name = "sylux"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
test-harness = []

# Register each nested test only alongside its real source file.
[[test]]
name = "harness_self"
path = "tests/harness_self.rs"
required-features = ["test-harness"]

[[test]]
name = "browser_fixture"
path = "tests/browser_fixture.rs"
harness = false
required-features = ["test-harness"]

[[test]]
name = "integration_names_listing"
path = "tests/integration/names_listing.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_setup_once"
path = "tests/integration/setup_once.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_local_lifecycle"
path = "tests/integration/local_lifecycle.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_admin_recovery"
path = "tests/integration/admin_recovery.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_binding"
path = "tests/integration/binding.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_sqlite_config"
path = "tests/integration/sqlite_config.rs"
required-features = ["test-harness"]

[[test]]
name = "fault_ownership"
path = "tests/fault/ownership.rs"
required-features = ["test-harness"]

[[test]]
name = "fault_publication"
path = "tests/fault/publication.rs"
required-features = ["test-harness"]

[[test]]
name = "fault_payload_seam"
path = "tests/fault/payload_seam.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_schema"
path = "tests/integration/schema.rs"
required-features = ["test-harness"]

[[test]]
name = "contract_setup_auth"
path = "tests/contract/setup_auth.rs"
required-features = ["test-harness"]

[[test]]
name = "contract_uploads"
path = "tests/contract/uploads.rs"
required-features = ["test-harness"]

[[test]]
name = "contract_private_storage"
path = "tests/contract/private_storage.rs"
required-features = ["test-harness"]

[[test]]
name = "contract_content"
path = "tests/contract/content.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_poc_journey"
path = "tests/integration/poc_journey.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_personal_storage"
path = "tests/integration/personal_storage.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_revocation"
path = "tests/integration/revocation.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_retry_reconcile"
path = "tests/integration/retry_reconcile.rs"
required-features = ["test-harness"]

[[test]]
name = "fault_commit"
path = "tests/fault/commit.rs"
required-features = ["test-harness"]

[[test]]
name = "fault_integrity"
path = "tests/fault/integrity.rs"
required-features = ["test-harness"]

[[test]]
name = "contract_isolation"
path = "tests/contract/isolation.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_production_surface"
path = "tests/integration/production_surface.rs"
required-features = ["test-harness"]

[[test]]
name = "integration_operator_status"
path = "tests/integration/operator_status.rs"
required-features = ["test-harness"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
libsqlite3-sys = { version = "=0.39.1", default-features = false, features = ["bundled"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["io", "rt"] }
cookie = { version = "=0.18.2", default-features = false }
axum-server = { version = "=0.9.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["fs"] }
http-body-util = { version = "=0.1.5", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json"] }
# Security-critical transitives: do not rely on a compatible but vulnerable floor.
password-hash = { version = "=0.6.1", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false }
ring = { version = "=0.17.14", default-features = false }
rustls-webpki = { version = "=0.103.16", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
