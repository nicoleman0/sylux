name: Docker release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Rehearsal version, for example v0.1.0 or v0.1.0-beta.11'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.event.created && !github.event.forced && !github.event.deleted &&
      github.repository == 'nicoleman0/sylux' && !github.event.repository.private &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner)
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      manifest: ${{ steps.bundle.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - name: Validate release source and version
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          source scripts/release-bundle.sh
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RELEASE_VERSION=$GITHUB_REF_NAME
          fi
          channel=$(release_channel "$RELEASE_VERSION") || fail 'Expected vX.Y.Z or vX.Y.Z-beta.N.'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            check_release_publish_ref "$RELEASE_VERSION" || fail 'Release tag is not authorized.'
            git fetch --no-tags origin refs/heads/main
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || fail 'Release source must be on main.'
          fi
          printf 'version=%s\nchannel=%s\n' "$RELEASE_VERSION" "$channel" >> "$GITHUB_OUTPUT"
          printf '### Docker release (%s)\n\n- %s (%s) from %s at %s\n' \
            "$GITHUB_EVENT_NAME" "$RELEASE_VERSION" "$channel" "$GITHUB_REF" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify release contracts
        run: bash scripts/test-release.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Identify runner image
        id: runner-image
        run: echo "version=${ImageVersion:?runner image version is missing}" >> "$GITHUB_OUTPUT"
      - name: Restore host Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 snapshot
        with:
          prefix-key: release-host-v1-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.github/workflows/beta-release.yml') }}
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install check tools
        run: |
          npm install --global npm@11.19.1
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools openssh-server
          sudo systemctl stop ssh.service ssh.socket
          sudo systemctl disable ssh.service ssh.socket
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cargo-deny
          key: release-cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.github/workflows/beta-release.yml', 'rust-toolchain.toml') }}
      - name: Install pinned cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/cargo-deny"
      - name: Check source
        env:
          CARGO_DENY_BIN: ${{ runner.temp }}/cargo-deny/bin/cargo-deny
        run: scripts/check.sh
      - name: Install browser prerequisites
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run Linux release gates
        env:
          CARGO_DENY_BIN: ${{ runner.temp }}/cargo-deny/bin/cargo-deny
        run: scripts/check-beta.sh
      - name: Package the exact checked source
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/package-beta.sh "$RELEASE_VERSION" .local/release
      - name: Validate the packaged assets and image
        id: bundle
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          source scripts/release-bundle.sh
          bundle=.local/release
          bash -n "$bundle/install-sylux.sh"
          manifest=$(verify_release_bundle "$bundle" "$RELEASE_VERSION" "$GITHUB_SHA")
          image=$(inspect_image "sylux:$RELEASE_VERSION" "$RELEASE_VERSION" "$GITHUB_SHA")
          test "$image" = "$(cat "$bundle/image-id.txt")"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
          {
            printf '\n- Build image %s, linux/amd64, OCI version %s, revision %s\n' "$image" "$RELEASE_VERSION" "$GITHUB_SHA"
            printf '\n```text\n'
            cat "$bundle/SHA256SUMS"
            printf '%s  SHA256SUMS\n```\n' "$manifest"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test the packaged image and restored state
        run: |
          export SYLUX_TEST_IMAGE
          SYLUX_TEST_IMAGE=$(cat .local/release/image-id.txt)
          scripts/syl7-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: sylux-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record the run artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          printf '\n- Candidate artifact ID %s, archive digest %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

  installer-qualify:
    name: Candidate installer and first upload
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact }}
          merge-multiple: true
          path: .local/candidate
      - name: Install browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
      - name: Exercise packaged installer and candidate bundle
        env:
          SYLUX_QUALIFY_VERSION: ${{ needs.qualify.outputs.version }}
          SYLUX_QUALIFY_MANIFEST: ${{ needs.qualify.outputs.manifest }}
          SYLUX_QUALIFY_DOCKER: existing
          SYLUX_QUALIFY_BUNDLE: .local/candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/qualify-install-sylux.sh

  upgrade-qualify:
    name: Packaged stable upgrade and fresh-root rollback
    needs: qualify
    if: needs.qualify.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYLUX_REHEARSE_VERSION: ${{ needs.qualify.outputs.version }}
      SYLUX_REHEARSE_MANIFEST: ${{ needs.qualify.outputs.manifest }}
      SYLUX_REHEARSE_BUNDLE: .local/candidate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact }}
          merge-multiple: true
          path: .local/candidate
      - name: Upgrade from published beta.10 to the packaged candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scripts/rehearse-docker-upgrade.sh upgrade
      - name: Restore the same-job archive with published beta.10
        run: scripts/rehearse-docker-upgrade.sh rollback
      - name: Remove the disposable fixture
        if: always()
        run: scripts/rehearse-docker-upgrade.sh cleanup

  publish:
    needs: [qualify, installer-qualify, upgrade-qualify]
    if: >-
      !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.event.created && !github.event.forced && !github.event.deleted &&
      github.repository == 'nicoleman0/sylux' && !github.event.repository.private &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      needs.qualify.result == 'success' && needs.installer-qualify.result == 'success' &&
      (needs.upgrade-qualify.result == 'success' ||
      (needs.qualify.outputs.channel == 'beta' && needs.upgrade-qualify.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact }}
          merge-multiple: true
          path: release
      - name: Publish the qualified Docker release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          QUALIFIED_MANIFEST: ${{ needs.qualify.outputs.manifest }}
        run: |
          source scripts/release-bundle.sh
          test -n "$QUALIFIED_MANIFEST"
          verify_release_bundle release "$RELEASE_VERSION" "$GITHUB_SHA" "$QUALIFIED_MANIFEST"
          check_release_publish_ref "$RELEASE_VERSION" || fail 'Release tag is not authorized.'
          remote_refs=$(git ls-remote --exit-code origin "$GITHUB_REF" "$GITHUB_REF^{}")
          test "$(tail -n 1 <<< "$remote_refs" | cut -f1)" = "$GITHUB_SHA"
          assets=(SHA256SUMS "${release_assets[@]}" install-sylux.sh)
          channel=$(release_channel "$RELEASE_VERSION")
          flags=()
          if [[ "$channel" == beta ]]; then
            flags=(--prerelease)
          fi
          cd release
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          Sylux $RELEASE_VERSION for Linux amd64 Docker installations. Download install-sylux.sh and follow the Docker quick start in docker-beta.md.

          Verify SHA256SUMS, load sylux-image.tar.gz, and pin Compose to the loaded image ID as described in the guide.
          Source commit: $GITHUB_SHA
          Source, browser and packaged-image recovery checks passed in this workflow.
          Physical durability and general schema upgrade support are outside qualification. Keep independent copies.
          Feedback: hello@corvus-dev.com
          EOF_NOTES
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --verify-tag --title "Sylux $RELEASE_VERSION" "${flags[@]}" --latest=false \
            --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_VERSION" --json assets > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" "${assets[@]}" <<'PY'
          import json, pathlib, sys
          assets = json.loads(pathlib.Path(sys.argv[1]).read_text())['assets']
          assert sorted(asset['name'] for asset in assets) == sorted(sys.argv[2:]), 'Release asset names changed'
          assert all(asset['size'] > 0 for asset in assets), 'Empty release asset'
          PY
          gh release edit "$RELEASE_VERSION" --draft=false --latest=false
          public="$RUNNER_TEMP/public-download"
          mkdir "$public"
          for asset in "${assets[@]}"; do
            if ! download "$RELEASE_VERSION" "$public" "$asset"; then
              gh release edit "$RELEASE_VERSION" --draft
              exit 1
            fi
          done
          if ! verify_release_bundle "$public" "$RELEASE_VERSION" "$GITHUB_SHA" "$QUALIFIED_MANIFEST"; then
            gh release edit "$RELEASE_VERSION" --draft
            exit 1
          fi
          if [[ "$channel" == stable ]]; then
            gh release edit "$RELEASE_VERSION" --latest
          fi

  docker-hub:
    needs: [qualify, ghcr]
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-hub-image.yml
    with:
      version: ${{ needs.qualify.outputs.version }}
      manifest: ${{ needs.qualify.outputs.manifest }}
      repository: ${{ vars.SYLUX_DOCKER_HUB_REPOSITORY }}
      username: ${{ vars.SYLUX_DOCKER_HUB_USERNAME }}
    secrets:
      token: ${{ secrets.SYLUX_DOCKER_HUB_PUSH_TOKEN }}

  ghcr:
    needs: [qualify, publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-image.yml
    with:
      version: ${{ needs.qualify.outputs.version }}
      manifest: ${{ needs.qualify.outputs.manifest }}
