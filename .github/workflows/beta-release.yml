name: PDF deadline diagnostic (no publication)

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      publish:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ !inputs.publish && github.ref == 'refs/heads/codex/beta5-pdf-diagnostic' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned tools
        run: |
          npm install --global npm@11.19.1
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium --only-shell
      - name: Repeat instrumented deadline case
        run: npm --prefix web run smoke -- --grep 'PDF zero-width stops' --repeat-each 100 > pdf-deadline.log 2>&1
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pdf-deadline-diagnostic
          path: |
            pdf-deadline.log
            web/test-results/
            evidence/poc/p6/smoke-results.json
          if-no-files-found: error
          retention-days: 7
