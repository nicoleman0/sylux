name: Linux container recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select recovery checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      recovery: ${{ steps.scope.outputs.recovery }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify required syntax parsers
        id: preflight
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-changes.py --base "$BASE" --head "$HEAD"
      - name: Load syntax parsers
        uses: ./.github/actions/ci-parsers
        with:
          needs-node: ${{ steps.preflight.outputs.needs_node }}
          needs-shfmt: ${{ steps.preflight.outputs.needs_shfmt }}
      - name: Select recovery checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-changes.py --base "$BASE" --head "$HEAD"

  recovery:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful change selection
        env:
          SELECTION: ${{ needs.changes.result }}
        run: '[[ "$SELECTION" == success ]] || { echo "Recovery change selection failed"; exit 1; }'
      - if: needs.changes.outputs.recovery == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: needs.changes.outputs.recovery == 'true'
        name: Install the temporary SSH server for the isolated client check
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          sudo systemctl stop ssh.service ssh.socket 2>/dev/null || true
          sudo systemctl disable ssh.service ssh.socket 2>/dev/null || true
      - if: needs.changes.outputs.recovery == 'true'
        name: Exercise host bind mount and stopped-service restore
        run: scripts/syl7-linux.sh
