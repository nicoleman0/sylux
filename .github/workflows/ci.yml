name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  account-authority-model:
    name: Account authority model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check model runner failure handling
        run: python3 scripts/test-account-authority-check.py

      - name: Check authority model and negative control
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: python3 scripts/check-account-authority.py --download --output "$RUNNER_TEMP/account-authority"

      - name: Retain model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-authority-model
          path: ${{ runner.temp }}/account-authority
          if-no-files-found: ignore

  check:
    name: Linux x86_64 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Identify runner image
        id: runner-image
        run: echo "version=${ImageVersion:?runner image version is missing}" >> "$GITHUB_OUTPUT"

      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml', 'rust-toolchain.toml') }}

      - name: Install pinned cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/cargo-deny"

      - name: Run documented checks
        env:
          CARGO_DENY_BIN: ${{ runner.temp }}/cargo-deny/bin/cargo-deny
        run: scripts/check.sh

      - name: Check storage and folder recovery contracts
        run: cargo test --locked --features test-harness --test integration_names_listing --test contract_uploads --test contract_private_storage --test contract_content --test contract_isolation --test integration_poc_journey --test integration_retry_reconcile

      - name: Install pinned browser prerequisites
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Check real TLS browser journeys
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          export S1_CERTUTIL
          S1_CERTUTIL=$(command -v certutil)
          mkdir -p evidence/ci
          export S1_HARNESS_OUTPUT
          S1_HARNESS_OUTPUT=$(mktemp -d "$PWD/evidence/ci/browser.XXXXXXXX")
          cargo test --locked --features test-harness --test browser_fixture

      - name: Check account authority browser journeys
        run: |
          npm --prefix web run smoke -- --grep 'account authority|account screens'
          npm --prefix web run smoke -- account-actions.spec.ts

      - name: Check live search responsiveness
        run: npm --prefix web run smoke -- search-responsiveness.spec.ts

      - name: Check action feedback and navigation lifetime
        run: npm --prefix web run smoke -- bulk-actions.spec.ts desktop-upload.spec.ts moves.spec.ts replacement.spec.ts smoke.spec.ts folder-recovery.spec.ts trash.spec.ts refresh-feedback.spec.ts appearance.spec.ts

      - name: Check PDF reader and failure recovery
        run: npm --prefix web run smoke -- preview.spec.ts pdf-render.spec.ts pdf-compatibility.spec.ts

      - name: Check listing metadata browser journeys
        run: npm --prefix web run smoke -- folder-sizes.spec.ts modified-dates.spec.ts sorting.spec.ts column-sorting.spec.ts mock-result-sorting.spec.ts trash-sort-validation.spec.ts browsing-context.spec.ts compact-files.spec.ts design-system.spec.ts
