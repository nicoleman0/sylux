name: GHCR image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      manifest:
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    if: >-
      github.event_name == 'push' && github.ref == format('refs/tags/{0}', inputs.version) &&
      github.event.created && !github.event.forced && !github.event.deleted &&
      github.repository == 'nicoleman0/sylux' && !github.event.repository.private &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      QUALIFIED_MANIFEST: ${{ inputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load the verified public release image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source scripts/release-bundle.sh
          check_release_publish_ref "$RELEASE_VERSION" || fail 'Release tag is not authorized.'
          test -n "$QUALIFIED_MANIFEST"
          alias_tag=$(release_alias "$RELEASE_VERSION")
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = false
          bundle="$RUNNER_TEMP/release"
          gh release download "$RELEASE_VERSION" --pattern "*" --dir "$bundle"
          verify_release_bundle "$bundle" "$RELEASE_VERSION" "$GITHUB_SHA" "$QUALIFIED_MANIFEST"
          id=$(load_release_image "$bundle" "$RELEASE_VERSION" "$GITHUB_SHA")
          printf 'id=%s\nalias=%s\n' "$id" "$alias_tag" >> "$GITHUB_OUTPUT"
      - name: Push the exact image and its channel alias
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
          ALIAS: ${{ steps.image.outputs.alias }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          for tag in "$RELEASE_VERSION" "$ALIAS"; do
            docker tag "$IMAGE_ID" "$image:$tag"
            docker push "$image:$tag"
          done
